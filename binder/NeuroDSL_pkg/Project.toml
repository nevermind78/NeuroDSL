name = "NeuroDSL"
uuid = "05fb6cdb-0fc8-4ca7-953f-ac7a677c77a0"
version = "0.5.0"

# Trimmed for a CPU-only demonstration image: only the packages actually
# `using`'d anywhere in src/ (verified by grep), plus CUDA. The real repo's
# Project.toml additionally declares Flux, Zygote, MLDatasets, Interact,
# WebIO, StatsPlots, BenchmarkTools, Metatheory, Functors, CUDA_Runtime_jll
# -- none of which any file in src/ actually imports; they support other
# parts of the project (training demos, benchmarks) not exercised by this
# notebook, so they're safely omitted here.
#
# CUDA itself is NOT optional, even for a CPU-only image: kernels.jl does
# `if Backend.CUDA_AVAILABLE; using CUDA; end` then later uses `@cuda` inside
# `if Backend.CUDA_AVAILABLE ... end` blocks -- but that's a plain runtime
# `if`, not `@static if`, so Julia macro-expands the whole block (both
# branches) while lowering the file, regardless of which branch actually
# runs. If CUDA.jl were absent, `@cuda` would be undefined at that point and
# precompilation would fail with `UndefVarError: @cuda not defined` --
# confirmed by hitting exactly this error while trimming this file. CUDA.jl
# the *package* precompiles fine with no physical GPU (its runtime artifact
# is a lazy artifact, not downloaded until actually used); only
# `CUDA.functional()` at runtime distinguishes "no GPU present", which is
# what `Backend.CUDA_AVAILABLE` actually gates.
[deps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
SparseArrays = "2f01184e-e22b-5df5-ae63-d93ebab69eaf"

[compat]
CUDA = "6"
julia = "1.10"
